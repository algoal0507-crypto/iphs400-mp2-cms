{% extends "admin/base_admin.html" %}
{% block content %}
  <h1>New News post</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="stack" method="post" data-preview-url="{{ rel('/admin/preview') }}" action="/admin/posts/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Slug <input type="text" name="slug" value="{{ values['slug'] }}" required></label>
    <label>Title <input type="text" name="title" value="{{ values['title'] }}" required></label>
    <label>Body (Markdown)
      <textarea name="body_md" rows="16">{{ values['body_md'] }}</textarea>
    </label>
    <p class="hint">New posts are saved as drafts. Only the Manager can publish.</p>
    <button type="submit" class="btn">Save draft</button>
  </form>
  {% include "admin/_preview.html" %}
{% endblock %}
