{% extends "admin/base_admin.html" %}
{% block content %}
  <h1>New News post</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/posts/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Slug <input type="text" name="slug" value="{{ values['slug'] }}" required></label>
    <label>Title <input type="text" name="title" value="{{ values['title'] }}" required></label>
    <label>Body (Markdown)
      <textarea name="body_md" rows="16" cols="80">{{ values['body_md'] }}</textarea>
    </label>
    <p>New posts are saved as drafts. Only the Manager can publish.</p>
    <button type="submit">Save draft</button>
  </form>
{% endblock %}
