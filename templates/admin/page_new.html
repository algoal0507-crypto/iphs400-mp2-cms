{% extends "admin/base_admin.html" %}
{% block content %}
  <h1>New page</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="stack" method="post" data-preview-url="{{ rel('/admin/preview') }}" action="/admin/pages/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Slug <input type="text" name="slug" value="{{ values['slug'] }}" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label>
    <label>Title <input type="text" name="title" value="{{ values['title'] }}" required></label>
    <label>Body (Markdown)
      <textarea name="body_md" rows="16">{{ values['body_md'] }}</textarea>
    </label>
    <label>Status
      <select name="status">
        <option value="draft" {% if values['status'] == 'draft' %}selected{% endif %}>Draft</option>
        <option value="published" {% if values['status'] == 'published' %}selected{% endif %}>Published</option>
      </select>
    </label>
    <button type="submit" class="btn">Create</button>
  </form>
  {% include "admin/_preview.html" %}
{% endblock %}
