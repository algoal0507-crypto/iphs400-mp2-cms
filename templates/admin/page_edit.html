{% extends "admin/base_admin.html" %}
{% block content %}
  <h1>Edit {{ page['title'] }}</h1>
  {% if saved %}<p class="success">Saved.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" data-preview-url="{{ rel('/admin/preview') }}" action="/admin/pages/{{ page['slug'] }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Title <input type="text" name="title" value="{{ page['title'] }}" required></label>
    <label>Body (Markdown)
      <textarea name="body_md" rows="16" cols="80">{{ page['body_md'] }}</textarea>
    </label>
    <label>Status
      <select name="status">
        <option value="draft" {% if page['status'] == 'draft' %}selected{% endif %}>Draft</option>
        <option value="published" {% if page['status'] == 'published' %}selected{% endif %}>Published</option>
      </select>
    </label>
    <button type="submit">Save</button>
  </form>
  {% include "admin/_preview.html" %}
{% endblock %}
