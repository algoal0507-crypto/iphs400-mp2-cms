{% extends "admin/base_admin.html" %}
{% block content %}
  <h1>New user</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/users/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ values['email'] }}" required></label>
    <label>Password (12+ characters) <input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
    <label>Role
      <select name="role">
        {% for r in roles %}
          <option value="{{ r }}" {% if values['role'] == r %}selected{% endif %}>{{ 'Manager' if r == 'admin' else 'Editor' }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Create user</button>
  </form>
{% endblock %}
