{% extends "base.html" %}
{% block title %}{{ page_title }} — {{ title }}{% endblock %}
{% block content %}
  <article class="page{% if page_class %} {{ page_class }}{% endif %}">
    <h1>{{ page_title }}</h1>
    {% if published %}<p class="post-meta">Published <time datetime="{{ published }}">{{ published }}</time></p>{% endif %}
    <div class="page-body">{{ body_html | safe }}</div>
  </article>
{% endblock %}
