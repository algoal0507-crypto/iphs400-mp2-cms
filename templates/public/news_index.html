{% extends "base.html" %}
{% block title %}News — {{ title }}{% endblock %}
{% block content %}
  <h1>News</h1>
  {% if posts %}
    <ul>
      {% for post in posts %}
        <li><a href="{{ post.href }}">{{ post.title }}</a> <small>{{ post.date }}</small></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No news yet.</p>
  {% endif %}
{% endblock %}
